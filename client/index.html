<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lightning Payment App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 2rem;
      text-align: center;
    }
    form {
      margin-bottom: 2rem;
    }
    input, button {
      padding: 0.5rem;
      font-size: 1rem;
      margin: 0.5rem;
    }
    #qrcode {
      margin-top: 1rem;
    }
    #invoiceDetails {
      margin-top: 2rem;
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      display: inline-block;
    }
    #invoiceAmount {
      font-weight: bold;
      margin-top: 1rem;
    }
    #invoiceText {
      display: none;
      word-wrap: break-word;
      max-width: 100%;
      text-align: left;
      margin-top: 1rem;
    }
    #toggleTextButton {
      display: none;
      margin-top: 0.5rem;
    }
    .paidStatus {
      color: green;
      font-weight: bold;
      font-size: 1.2rem;
    }
    #usdAmount {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #555;
    }
    #timer {
      margin-top: 0.5rem;
      color: red;
    }
  </style>
</head>
<body>
  <h1>⚡️Pay with Lightning!</h1>

  <form id="invoiceForm">
    <label for="amount">Amount (sats):</label>
    <input type="number" id="amount" name="amount" required min="1">
    <button type="submit">Create Invoice</button>
  </form>

  <div id="qrcode"></div>

  <div id="invoiceDetails" style="display: none;">
    <div id="invoiceAmount"></div>
    <div id="usdAmount"></div>
    <div id="timer"></div>
    <pre id="invoiceText"></pre>
    <button id="toggleTextButton">Show Raw Invoice</button>
  </div>

  <button onclick="copyInvoice()">Copy Invoice</button>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
